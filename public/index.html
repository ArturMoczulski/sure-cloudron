<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sure Finance</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17221b;background:#f5f7f2}body{margin:0}.shell{max-width:1100px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:25px;font-weight:800;letter-spacing:-.04em}.badge{background:#dcefe2;color:#24613a;padding:8px 12px;border-radius:999px;font-size:13px}.hero{background:#183d2a;color:white;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{font-size:34px;letter-spacing:-.05em;margin:0 0 8px}.hero p{color:#c8dfcf;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card{background:white;border:1px solid #e3e9e1;border-radius:16px;padding:20px}.label{color:#68736b;font-size:13px}.value{font-size:28px;font-weight:750;margin-top:8px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.button{background:#d8f36b;color:#18220f;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.muted{color:#68736b;font-size:13px}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0eb;font-size:14px}.table th{color:#68736b;font-weight:600}.positive{color:#23804a}.negative{color:#b44935}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><main class="shell"><div class="top"><div class="brand">Sure Finance</div><div class="badge">Private · Cloudron</div></div><section class="hero"><h1>Know where your money goes.</h1><p>Import a CSV from your bank or Monarch Money. Your data stays on this server.</p></section><section class="grid"><div class="card"><div class="label">Net activity</div><div class="value" id="net">$0.00</div></div><div class="card"><div class="label">Income</div><div class="value positive" id="income">$0.00</div></div><div class="card"><div class="label">Expenses</div><div class="value negative" id="expenses">$0.00</div></div></section><section class="card"><div class="actions"><input id="file" type="file" accept=".csv,text/csv"><button class="button" id="import">Import CSV</button><span class="muted" id="status">No transactions imported yet.</span></div><table class="table"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Upload a CSV to get started.</td></tr></tbody></table></section></main><script>
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);let data=[];
function render(){let income=data.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0), expenses=data.filter(x=>x.amount<0).reduce((a,x)=>a+x.amount,0);document.querySelector('#income').textContent=money(income);document.querySelector('#expenses').textContent=money(expenses);document.querySelector('#net').textContent=money(income+expenses);document.querySelector('#rows').innerHTML=data.slice().reverse().slice(0,100).map(x=>`<tr><td>${x.date||''}</td><td>${x.merchant||''}</td><td>${x.category||'Uncategorized'}</td><td class="${x.amount>=0?'positive':'negative'}">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Upload a CSV to get started.</td></tr>';}
fetch('/api/transactions').then(r=>r.json()).then(x=>{data=x;render()});document.querySelector('#import').onclick=()=>{const f=document.querySelector('#file').files[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{const lines=reader.result.split(/\r?\n/).filter(Boolean), headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());const idx=(names)=>names.map(n=>headers.indexOf(n)).find(i=>i>=0);const date=idx(['date','transaction date']), merchant=idx(['merchant','description','name']), amount=idx(['amount','transaction amount']);data=lines.map(line=>{const c=line.split(',');return{date:c[date]||'',merchant:c[merchant]||'',category:'',amount:Number((c[amount]||'0').replace(/[$,]/g,''))||0}});const r=await fetch('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transactions:data})});document.querySelector('#status').textContent=r.ok?`${data.length} transactions imported.`:'Import failed.';render()};reader.readAsText(f)};
</script></body></html>
